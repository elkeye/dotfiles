# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

source = ~/.config/hypr/autostart.conf

source = ~/.config/hypr/bindings/tiling.conf
source = ~/.config/hypr/bindings/utilities.conf
source = ~/.config/hypr/bindings/media.conf

#############
### THEME ###
#############

source=~/.config/hypr/mocha.conf


exec = gsettings set org.gnome.desktop.interface gtk-theme "catppuccin-macchiato-mauve-standard+default" # for GTK3 apps
#exec = gsettings set org.gnome.desktop.interface color-scheme "catppuccin-macchiato-mauve-standard+default" # for GTK4 apps
exec = gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark"


#exec = gsettings set org.gnome.desktop.interface gtk-theme "Catppuccin-Purple-Dark" # for GTK3 apps
#exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" # for GTK4 apps

env = GTK_THEME,catppuccin-macchiato-mauve-standard+default

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = DP-1, 1920x1080@165, 0x0, 1, bitdepth, 10
#monitor = HDMI-A-1, 1920x1080@60, 0x0, 1, mirror, DP-1

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:



#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

#fcitx5
#env = GTK_IM_MODULE=fcitx
#env = QT_IM_MODULE=fcitx
#env = XMODIFIERS=@im=fcitx

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,catppuccin-macchiato-dark-cursors
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-macchiato-dark-cursors

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = GDK_BACKEND,wayland,x11,*
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
#env = QT_STYLE_OVERRIDE,kvantum

# for nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
# allow g-sync 1
env = __GL_GSYNC_ALLOWED,0
# enable adaptive sync 1
env = __GL_VRR_ALLOWED,0

#####################
### LOOK AND FEEL ###
#####################

### nvidia:
misc:vrr = 0
misc:vfr = 0
render:direct_scanout = 0
cursor:no_hardware_cursors = 1
cursor:no_break_fs_vrr = 1


###

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

   border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $lavender
    col.inactive_border = $overlay0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
     allow_tearing = true



    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1 #0.95
    inactive_opacity = 1 #0.8

#    drop_shadow = true
 #   shadow_range = 4
  #  shadow_render_power = 3
   # col.shadow = rgba(1a1a1aee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    #bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    bezier = myBezier, 0.05, 0.9, 0.05, 1.0

    animation = windows, 1, 4, myBezier #7
    animation = windowsOut, 1, 4, default, popin 80% # def speed 7
    animation = border, 1, 7, default # def speed 10
    animation = borderangle, 1, 5, default # def speed 8
    animation = fade, 1, 4, default # def speed 7
    animation = workspaces, 1, 2, default # def speed 6
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model = ,qwerty
    kb_options = grp:caps_toggle
    kb_rules =

    repeat_delay = 250
    repeat_rate = 30

    follow_mouse = 1

    float_switch_override_focus = 0

    force_no_accel = true

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

####################
### KEYBINDINGSS ###
####################

#change language in fcitx5
#bind = SHIFT, Alt_L, exec, fcitx5-remote -t

#toggle hyprbars
#bind = $mainMod ALT, B, plugin:hyprbars:nobar

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    #no_focus = true
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
 workspace = w[tv1], gapsout:0, gapsin:0
 workspace = f[1], gapsout:0, gapsin:0
 windowrule {
     name = no-gaps-wtv1
     match:float = false
     match:workspace = w[tv1]

     border_size = 0
     rounding = 0
 }

 windowrule {
     name = no-gaps-f1
     match:float = false
     match:workspace = f[1]

     border_size = 0
     rounding = 0
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = krita-history-popup
    match:float = true
    match:title = Krita

    no_initial_focus = on
}

#windowrule = match:class ^(steam_app_.*|steam_proton|streaming_client|gamescope)$, immediate yes

# spotify rules
#windowrulev2 = workspace 3 silent, class:^(Spotify)$
workspace = 3, gapsin:0, gapsout:0


# steam rules
#windowrulev2 = fullscreen, class:^steam_app\d+$
workspace = special, 10, border:false, rounding:false
